<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- BOOTSTRAP -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="../styles/styles.css">
    <title>Contacto | Mi Regalería</title>
</head>

<body>

    <header>

        <nav class="navbar navbar-expand-lg bg-nav-mio">
            <div class="container-fluid">

                <!-- Logo -->
                <a class="navbar-brand" href="../index.html">
                    <img src="../assets/img/logo-miRegaleria3.png" alt="Logo de Mi Regalería" class="logo">
                </a>

                <!-- Botón hamburguesa -->
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                    aria-controls="navbarNav" aria-expanded="false" aria-label="Abrir menú de navegación">

                    <span class="navbar-toggler-icon"></span>
                </button>

                <!-- Menú de navegación -->
                <div class="collapse navbar-collapse" id="navbarNav">

                    <ul class="navbar-nav ms-auto">

                        <li class="nav-item">
                            <a class="nav-link" href="../index.html">Inicio</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="nosotros.html">Nosotros</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="productos.html">Productos</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="faq.html">FAQ</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" href="contacto.html">Contacto</a>
                        </li>

                    </ul>

                </div>
            </div>
        </nav>
    </header>


    <main>

        <!-- Encabezado principal del documento -->
        <section>
            <h1>Contacto</h1>
            <p>Dejanos tu consulta o ponete en contacto con nosotros para coordinar tu pedido.</p>
        </section>

        <!-- Sección de formulario con accesibilidad -->

        <div class="contacto-grid">

            <!-- Formulario de contacto -->
            <section class="contacto-formulario" id="contacto">

                <h2>Escribinos</h2>

                <form action="#" method="POST">

                    <p>
                        <label for="nombre">Nombre:</label><br>
                        <input type="text" id="nombre" name="nombre" placeholder="Ingresá tu nombre" required>
                    </p>

                    <p>
                        <label for="celular">Celular:</label><br>
                        <input type="tel" id="celular" name="celular" placeholder="Ej: 3581234567" required>
                    </p>

                    <button type="submit">Enviar</button>

                </form>

            </section>

            <!-- Atención al cliente -->
            <section class="contacto-atencion">

                <h2>Atención al cliente</h2>

                <figure>
                    <img src="../assets/img/atencioAlcliente.png"
                        alt="Mostrador de atención al cliente de Mi Regalería">

                    <figcaption>
                        Atención personalizada en nuestro local de Río Cuarto
                        y envíos a todo el país.
                    </figcaption>
                </figure>

            </section>

        </div>
    </main>

    <footer>
        <p class="p-footer">&copy; 2026 Mi Regalería. Todos los derechos reservados.</p>
        <p class="p-footer">Seguinos en nuestras redes:</p>

        <ul class="nav-ul">

            <li><a href="#">Instagram</a></li>
            <li><a href="#">Facebook</a></li>
        </ul>

    </footer>
    <!-- BOOTSTRAP -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
